<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075844"><title>Voter Awareness — General Knowledge</title><link rel="stylesheet" href="../assets/app.css"></head><body><main class="app art-page"><header class="topbar"><a class="link" href="/">مرکزی صفحہ ←</a><span class="topbar-title">ووٹر آگاہی</span><span></span></header><section class="art-frame"><img src="../assets/official-page-4.png" alt="ووٹ آگاہی — آسان سوالات اور جوابات"></section><div class="sticky-action"><button class="btn" id="complete">میں نے معلومات پڑھ لی ہیں</button><div class="error center" id="error"></div></div></main><script src="../assets/app.js"></script><script>(async()=>{if(!VoterApp.requireSession())return;try{await VoterApp.api('/activity',{method:'POST',body:JSON.stringify({type:'GENERAL_KNOWLEDGE_STARTED'})})}catch(e){error.textContent=e.message}})();complete.onclick=async()=>{VoterApp.setLoading(complete,true,'مکمل کریں');try{await VoterApp.api('/progress/learn',{method:'POST'});location.href='/'}catch(e){error.textContent=e.message;VoterApp.setLoading(complete,false,'میں نے معلومات پڑھ لی ہیں')}}</script></body></html>
