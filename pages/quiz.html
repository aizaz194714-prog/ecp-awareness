<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075844"><title>Voter Awareness Quiz</title><link rel="stylesheet" href="../assets/app.css"></head><body><main class="app app-shell"><header class="topbar"><a class="link" href="/">← Home</a><span class="topbar-title">Awareness Quiz</span><span></span></header><section id="quiz"><div class="quiz-banner"><p class="eyebrow">Awareness Quiz</p><h1>Test your knowledge</h1></div><div class="quiz-head"><div class="progress-row"><span id="count">Question 1 of 5</span><span id="pct">20%</span></div><div class="progress"><span id="bar" style="width:20%"></span></div></div><div class="question-card"><p class="eyebrow">Choose one answer</p><h1 class="question" id="question">Loading question…</h1><div class="options" id="options"></div><div class="quiz-actions"><button class="btn secondary" id="prev">Previous</button><button class="btn" id="next" disabled>Next</button></div><div class="error center" id="error"></div></div></section></main><script src="../assets/app.js"></script><script>
const questions=[{q:'Who can vote in an election?',o:['Only government employees','Registered citizens who meet the legal voting age','Only people with a driving licence']},{q:'Which document should you take to vote?',o:['Your original CNIC','A student card','A utility bill']},{q:'Where should you cast your vote?',o:['At any nearby station','At your assigned polling station','At a government office']},{q:'What should you do after receiving your ballot paper?',o:['Mark your choice privately','Show it to other voters','Take it home']},{q:'What happens after you mark the ballot?',o:['Give it to another voter','Place it in the correct ballot box','Photograph and share it']}];let current=0,answers=Array(5).fill(null);const q=question,opts=options;
function render(){const item=questions[current];count.textContent=`Question ${current+1} of 5`;pct.textContent=(current+1)*20+'%';bar.style.width=(current+1)*20+'%';q.textContent=item.q;opts.innerHTML='';item.o.forEach((label,i)=>{const b=document.createElement('button');b.type='button';b.className='option'+(answers[current]===i?' selected':'');b.textContent=label;b.onclick=()=>{answers[current]=i;render()};opts.appendChild(b)});prev.disabled=current===0;next.disabled=answers[current]===null;next.textContent=current===4?'Submit quiz':'Next'}
prev.onclick=()=>{if(current){current--;render()}};next.onclick=async()=>{if(answers[current]===null)return;if(current<4){current++;render();scrollTo(0,0);return}VoterApp.setLoading(next,true,'Submit quiz');try{await VoterApp.api('/quiz/submit',{method:'POST',body:JSON.stringify({answers})});location.href='/pages/completion.html'}catch(e){error.textContent=e.message;VoterApp.setLoading(next,false,'Submit quiz')}};(async()=>{if(!VoterApp.requireSession())return;try{await VoterApp.loadProgress();await VoterApp.api('/activity',{method:'POST',body:JSON.stringify({type:'QUIZ_STARTED'})});render()}catch(e){error.textContent=e.message}})();
</script></body></html>
