<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075844"><title>Journey Completed</title><link rel="stylesheet" href="../assets/app.css"></head><body><main class="app app-shell"><header class="topbar"><div class="brand"><span class="brand-mark">ECP</span><span class="brand-copy">Voter Awareness<small>Journey summary</small></span></div><button class="link" onclick="VoterApp.signOut()">Finish</button></header><section class="complete-screen" id="content"><div class="state-card"><span class="spinner" style="display:inline-block;border-color:#c6ddd4;border-top-color:#075844"></span><p class="hint" style="margin-top:14px">Confirming completion…</p></div></section></main><script src="../assets/app.js"></script><script>(async()=>{const el=document.querySelector('#content');try{const {participant}=await VoterApp.loadProgress(),p=participant.progress;if(!(p.learned&&p.gameCompleted&&p.quizCompleted)){location.replace('/pages/home.html');return}el.innerHTML=`<div class="success-mark">✓</div><div class="center"><p class="eyebrow">All activities complete</p><h1>Awareness Journey Completed</h1><p class="lead">Thank you for completing the Voter Awareness Activity.</p></div><div class="summary"><div class="summary-row"><strong>Voting Guide</strong><span>✓ Complete</span></div><div class="summary-row"><strong>Voting Game</strong><span>✓ Complete</span></div><div class="summary-row"><strong>Awareness Quiz</strong><span>✓ Complete</span></div><div class="summary-row"><strong>Quiz score</strong><span>${p.quizScore} / ${p.quizTotal}</span></div></div><a class="btn" href="/pages/home.html">View journey summary</a>`}catch(e){el.innerHTML=`<div class="state-card surface"><div class="state-icon">!</div><h2>Unable to confirm completion</h2><p class="error center">${VoterApp.escapeHtml(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`}})();</script></body></html>
