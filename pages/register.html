<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075844"><title>Participant Registration | ECP</title><link rel="stylesheet" href="../assets/app.css"><link rel="stylesheet" href="../assets/index.css"></head><body class="register-page"><main class="register-shell"><form class="register-card" id="entry"><div class="brand"><span class="brand-mark">ECP</span><span class="brand-copy">Voter Awareness<small>Participant registration</small></span></div><p class="eyebrow">Start your awareness journey</p><h1>Enter your CNIC</h1><p class="lead" style="margin-bottom:23px">New and returning participants use the same number. Your existing progress is restored automatically.</p><label for="cnic">CNIC number</label><div class="input-wrap"><input class="field" id="cnic" inputmode="numeric" autocomplete="off" maxlength="13" placeholder="XXXXX-XXXXXXX-X" aria-describedby="error"></div><div class="error" id="error" role="alert"></div><button class="btn" id="continue" type="submit">Continue</button></form></main><script src="../assets/app.js"></script><script>const allowed=new Set(['/','/pages/quiz.html','/pages/voting-game.html']),requested=new URLSearchParams(location.search).get('next'),next=allowed.has(requested)?requested:'/';if(VoterApp.session.token)location.replace(next);const form=document.querySelector('#entry'),input=document.querySelector('#cnic'),error=document.querySelector('#error'),button=document.querySelector('#continue');input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,13);error.textContent=''});form.addEventListener('submit',async event=>{event.preventDefault();const cnic=input.value.replace(/\D/g,'');if(cnic.length<5||cnic.length>13){error.textContent='Enter a valid CNIC number.';input.focus();return}VoterApp.setLoading(button,true,'Continue');try{const data=await VoterApp.api('/register',{method:'POST',body:JSON.stringify({cnic})});VoterApp.session.token=data.token;location.replace(next)}catch(e){error.textContent=e.message;VoterApp.setLoading(button,false,'Continue')}});</script></body></html>
