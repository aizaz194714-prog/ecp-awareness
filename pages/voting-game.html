<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#075844"><title>Voting Journey Maze</title><link rel="stylesheet" href="../assets/app.css"><style>
html,body{overscroll-behavior:none}.game-app{height:100svh;display:flex;flex-direction:column;overflow:hidden;background:#f5faf7}.game-head{padding:9px 14px 11px;border-bottom:1px solid var(--line);flex:none;background:#fffef9;box-shadow:0 4px 18px rgba(4,61,49,.07);z-index:8}.game-head-row{display:flex;align-items:center;justify-content:space-between}.game-head .link{padding:7px 3px}.game-head h1{font-size:18px;margin:0}.stage-panel{text-align:center;margin-top:3px}.stage-panel .eyebrow{margin:0 0 2px;font-size:10px}.stage-panel strong{display:block;color:var(--deep);font-size:14px;line-height:1.2;letter-spacing:.03em}.dots{display:flex;justify-content:center;gap:7px;margin-top:7px}.dot{width:7px;height:7px;border-radius:50%;background:#d2dfda;border:1px solid #aac0b8}.dot.done{background:var(--forest);border-color:var(--forest)}.dot.current{background:var(--gold);border-color:#c78d13;box-shadow:0 0 0 3px rgba(239,184,63,.2)}
.board-space{min-height:0;flex:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#dcece5,#edf5f1);padding:8px}.maze{position:relative;line-height:0;height:100%;max-width:100%;aspect-ratio:1102/1426;overflow:hidden;background:#fff;border-radius:12px;box-shadow:0 10px 27px rgba(4,61,49,.16)}.maze .bg{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}.player,.cp{position:absolute;left:0;top:0;pointer-events:none;z-index:4}.player{width:23px;height:23px;margin:-11.5px 0 0 -11.5px;border-radius:7px;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 2px var(--forest),0 3px 8px #0007;transform:rotate(45deg)}.player::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--forest)}.player.run{box-shadow:0 0 0 3px var(--forest),0 0 0 7px rgba(239,184,63,.45)}.cp{width:23px;height:23px;margin:-11.5px 0 0 -11.5px;border-radius:50%;display:grid;place-items:center;font:800 10px/1 var(--font);transition:.18s}.cp.locked{z-index:2;background:rgba(255,255,255,.86);color:#668078;border:1.5px solid #8aa39a;box-shadow:0 2px 5px rgba(0,0,0,.14)}.cp.current{z-index:3;width:27px;height:27px;margin:-13.5px 0 0 -13.5px;background:var(--gold);color:var(--deep);border:2px solid #fff;box-shadow:0 0 0 3px var(--forest),0 3px 9px #0005;font-size:11px}.cp.done{z-index:2;background:var(--forest);color:#fff;border:2px solid #fff;box-shadow:0 2px 6px #0004}.cp.done::after{content:"✓"}.cp.done span{display:none}
.controls-panel{flex:none;padding:7px 14px calc(8px + env(safe-area-inset-bottom));background:#fffef9;border-top:1px solid var(--line);box-shadow:0 -7px 20px rgba(4,61,49,.06)}.dpad{width:206px;height:122px;margin:auto;display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,55px);gap:7px;justify-content:center}.move{border:0;border-radius:15px;background:var(--forest);color:#fff;font-size:22px;font-weight:900;touch-action:none;user-select:none;box-shadow:0 6px 14px rgba(7,88,68,.2)}.move:active,.move.active{background:var(--leaf);transform:scale(.96)}.move[data-d=up]{grid-column:2}.move[data-d=left]{grid-column:1;grid-row:2}.move[data-d=down]{grid-column:2;grid-row:2}.move[data-d=right]{grid-column:3;grid-row:2}.control-help{text-align:center;font-size:10px;color:var(--muted);margin:2px 0 0;line-height:1.3}
.checkpoint{position:absolute;z-index:10;left:10px;right:10px;bottom:10px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:19px;padding:16px;line-height:1.35;box-shadow:0 12px 35px #002a2280;display:none}.checkpoint.show{display:block}.checkpoint h2{font-size:16px;color:var(--forest);margin-bottom:6px}.checkpoint p{font-size:13px;margin:5px 0 13px;color:var(--muted)}.checkpoint .btn{min-height:44px}.game-error{position:absolute;inset:auto 10px 10px;z-index:12;background:#fff;padding:14px;border-radius:14px;line-height:1.4;color:var(--danger)}
@media(max-height:680px){.game-head{padding-top:5px;padding-bottom:6px}.stage-panel{margin-top:0}.dots{margin-top:4px}.controls-panel{padding:4px 10px calc(5px + env(safe-area-inset-bottom))}.dpad{height:91px;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,41px);gap:5px}.move{min-height:41px;font-size:18px;border-radius:12px}.control-help{margin:0}.board-space{padding:5px}}
@media(min-width:700px){body{padding:0}.game-app{min-height:100svh;border-radius:0;max-width:760px}.board-space{padding:10px}.maze{border-radius:16px}.controls-panel{padding-bottom:8px}.dpad{height:104px;grid-template-rows:repeat(2,46px)}.move{min-height:46px}}
</style></head><body><main class="app game-app"><header class="game-head"><div class="game-head-row"><a class="link" href="/pages/home.html">← Journey</a><h1>Voting Journey</h1><button class="link" id="restart">Restart</button></div><div class="stage-panel"><span class="eyebrow" id="stageCount">Stage 1 of 5</span><strong id="stageName">HOME / CNIC</strong><div class="dots" id="dots" aria-label="Game progress"></div></div></header><section class="board-space"><div class="maze" id="maze"><img class="bg" id="mazeImage" src="../assets/official-page-7.png" alt="Election Commission of Pakistan voting maze"><div class="cp" id="cp0"><span>1</span></div><div class="cp" id="cp1"><span>2</span></div><div class="cp" id="cp2"><span>3</span></div><div class="cp" id="cp3"><span>4</span></div><div class="cp" id="cp4"><span>5</span></div><div class="player" id="player" aria-label="Player position"></div><aside class="checkpoint" id="card" aria-live="polite"><h2 id="cardTitle"></h2><p id="cardText"></p><button class="btn" id="cardContinue">Continue</button></aside></div></section><section class="controls-panel"><div class="dpad" aria-label="Movement controls"><button class="move" data-d="up" aria-label="Move up">▲</button><button class="move" data-d="left" aria-label="Move left">◀</button><button class="move" data-d="down" aria-label="Move down">▼</button><button class="move" data-d="right" aria-label="Move right">▶</button></div><p class="control-help">Press and hold to move · Arrow keys / WASD also work</p></section></main><script src="../assets/app.js"></script><script src="../assets/maze-game.js"></script></body></html>
