<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075844"><title>Your Awareness Journey</title><link rel="stylesheet" href="../assets/app.css"></head><body><main class="app app-shell"><header class="topbar"><div class="brand"><span class="brand-mark">ECP</span><span class="brand-copy">Voter Awareness<small>Your learning journey</small></span></div><button class="link" onclick="VoterApp.signOut()">Sign out</button></header><div class="offline" id="error" role="alert"></div><section class="journey-hero"><p class="eyebrow" id="greeting">Welcome</p><h1>Your Awareness Journey</h1><p class="lead">Complete each activity in order. Your progress is saved automatically.</p><div class="progress-row"><span>Overall progress</span><span id="percent">0%</span></div><div class="progress"><span id="bar" style="width:0"></span></div></section><section class="journey" id="steps" aria-busy="true"><article class="step"><div class="step-icon"><span class="spinner" style="border-color:#c6ddd4;border-top-color:#075844"></span></div><div><span class="status">Loading</span><h2>Preparing your journey</h2><p>Please wait a moment…</p></div></article></section></main><script src="../assets/app.js"></script><script>async function init(){const box=document.querySelector('#error');try{const {participant}=await VoterApp.loadProgress();const p=participant.progress,value=VoterApp.progressValue(p);document.querySelector('#greeting').textContent=participant.returning?'Welcome back':'Welcome';document.querySelector('#percent').textContent=value+'%';document.querySelector('#bar').style.width=value+'%';const items=[{n:'✓',title:'Registration',desc:'Your identity has been accepted',done:true},{n:'01',title:'Learn how voting works',desc:'A clear guide to the five voting stages',done:p.learned,href:'/pages/learn.html',action:p.learned?'Review guide':'Start learning'},{n:'02',title:'Voting Maze Game',desc:'Navigate each stage of the voting journey',done:p.gameCompleted,locked:!p.learned,href:'/pages/voting-game.html',action:p.gameCompleted?'Play again':'Play game'},{n:'03',title:'Voter Awareness Quiz',desc:'Check your knowledge with five questions',done:p.quizCompleted,locked:!p.gameCompleted,href:'/pages/quiz.html',action:p.quizCompleted?'Review quiz':'Start quiz'}];document.querySelector('#steps').innerHTML=items.map(x=>`<article class="step ${x.done?'complete':''} ${x.locked?'locked':''}"><div class="step-icon">${x.done?'✓':x.n}</div><div><span class="status">${x.done?'Complete':x.locked?'Locked':'Ready'}</span><h2>${x.title}</h2><p>${x.desc}</p>${x.href?`<a class="btn small" ${x.locked?'aria-disabled="true"':'href="'+x.href+'"'}>${x.action}</a>`:''}</div></article>`).join('');if(value===100)document.querySelector('#steps').insertAdjacentHTML('beforeend','<a class="btn" href="/pages/completion.html">View completion</a>')}catch(e){box.textContent=e.message;box.classList.add('show');document.querySelector('#steps').innerHTML='<div class="state-card surface"><div class="state-icon">!</div><h2>Unable to load progress</h2><button class="btn" onclick="location.reload()">Try again</button></div>'}}init();</script></body></html>
